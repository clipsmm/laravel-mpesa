name: Release on merged pull request

on:
  pull_request:
    types: [closed]
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out merged target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, json, openssl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run checks
        run: composer check

      - name: Audit dependencies
        run: composer audit

      # The latest git tag is the source of truth for the current version
      # (composer.json intentionally omits "version"). The bump defaults to
      # patch and can be widened with a single release:minor / release:major
      # label on the merged pull request.
      - name: Compute next version
        id: version
        run: |
          selected=()
          while IFS= read -r label; do
            case "$label" in
              release:patch|release:minor|release:major) selected+=("$label") ;;
            esac
          done < <(jq -r '.pull_request.labels[]?.name' "$GITHUB_EVENT_PATH")

          if [ "${#selected[@]}" -gt 1 ]; then
            echo "Use only one release label: ${selected[*]}" >&2
            exit 1
          fi

          bump=patch
          if [ "${#selected[@]}" -eq 1 ]; then
            bump="${selected[0]#release:}"
          fi

          latest_tag=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          current=${latest_tag#v}
          if [ -z "$current" ]; then
            current=0.0.0
          fi

          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest tag is not a semantic version: $latest_tag" >&2
            exit 1
          fi

          next=$(php -r '
            [$major, $minor, $patch] = array_map("intval", explode(".", $argv[1]));
            echo match ($argv[2]) {
              "major" => ($major + 1).".0.0",
              "minor" => $major.".".($minor + 1).".0",
              default => $major.".".$minor.".".($patch + 1),
            };
          ' "$current" "$bump")

          if git rev-parse --verify --quiet "refs/tags/v$next" >/dev/null; then
            echo "Tag v$next already exists." >&2
            exit 1
          fi

          echo "Releasing $current -> $next ($bump)"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Create and push annotated tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --verify-tag \
            --title "v$VERSION" \
            --generate-notes
